[workspace]
members = ["crates/*"]
exclude = ["native"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
# Fuzzing substitute (docs/45 row 6): stable MSVC has no cargo-fuzz. Dev-dependency of the parser crates only.
proptest = { version = "1", default-features = false, features = ["std"] }

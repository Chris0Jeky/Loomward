[package]
name = "loomward-service"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Loomward v0.3 view service: the typed ViewService both adapters call. Owns ingress, deadlines, idempotency, node IDs, cursors, provenance and revocation; the engine and catalogue own the work."

[dependencies]
loomward-protocol = { path = "../loomward-protocol" }
loomward-engine = { path = "../loomward-engine" }
loomward-catalog = { path = "../loomward-catalog" }
loomward-telemetry = { path = "../loomward-telemetry" }
loomward-shell = { path = "../loomward-shell" }
loomward-apps = { path = "../loomward-apps" }
loomward-backup = { path = "../loomward-backup" }
# LW-118: the Ask tool loop and provider interface (no network code; the broker is a separate process).
loomward-ask = { path = "../loomward-ask" }
loomward-operations = { path = "../loomward-operations" }
# copy-primitives: the docs/47 C5 lab executor; served for synthetic sessions only (copy.rs).
loomward-windows = { path = "../loomward-windows", features = ["copy-primitives", "diagnostics-export"] }
rusqlite = { version = "0.38.0", features = ["bundled", "hooks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
getrandom = "0.4"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
loomward-ask = { path = "../loomward-ask", features = ["testkit"] }
proptest.workspace = true
loomward-windows = { path = "../loomward-windows", features = ["fixtures"] }
loomward-catalog = { path = "../loomward-catalog", features = ["test-hooks"] }
# #567: the journal append fault seam, to lose an acknowledgement under the service copy module.
loomward-operations = { path = "../loomward-operations", features = ["fault-injection"] }
tempfile.workspace = true

[features]
# `paths::test_roots_base` for other crates' tests (#465); never enabled by a normal build.
test-support = []

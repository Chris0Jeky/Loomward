[package]
name = "loomward-service"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Loomward v0.3 view service: the typed ViewService both adapters call. Owns ingress, deadlines, idempotency, node IDs, cursors, provenance and revocation; the engine and catalogue own the work."

[dependencies]
loomward-protocol = { path = "../loomward-protocol" }
loomward-engine = { path = "../loomward-engine" }
loomward-catalog = { path = "../loomward-catalog" }
loomward-telemetry = { path = "../loomward-telemetry" }
loomward-shell = { path = "../loomward-shell" }
loomward-apps = { path = "../loomward-apps" }
loomward-backup = { path = "../loomward-backup" }
loomward-windows = { path = "../loomward-windows" }
rusqlite = { version = "0.38.0", features = ["bundled", "hooks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
getrandom = "0.4"

[dev-dependencies]
loomward-windows = { path = "../loomward-windows", features = ["fixtures"] }
loomward-catalog = { path = "../loomward-catalog", features = ["test-hooks"] }
tempfile.workspace = true

[features]
# `paths::test_roots_base` for other crates' tests (#465); never enabled by a normal build.
test-support = []

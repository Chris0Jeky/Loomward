[package]
name = "loomward-catalog"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled", "hooks"] }
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.27.0"
jsonschema = { version = "0.46.0", default-features = false }

[package]
name = "loomward-catalog"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license.workspace = true

[features]
# Test seams for dependent crates' tests (#356); never enabled by a production build.
test-hooks = ["rusqlite/trace"]

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled", "hooks"] }
crossbeam-channel = "0.5.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
# Statement counting in the publication-cost test (#646); a test-only feature, no new crate.
rusqlite = { version = "0.38.0", features = ["trace"] }
tempfile = "3.27.0"
jsonschema = { version = "0.58.6", default-features = false }

# The test watchdog's thread report (#495); already in the lockfile, no new crate.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.190"

# Needs the crash points in src/crashpoint.rs, which exist only with the feature.
[[test]]
name = "crash_sweep"
required-features = ["test-hooks"]

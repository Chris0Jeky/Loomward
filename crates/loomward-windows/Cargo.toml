[package]
name = "loomward-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Explicit opt-in: disposable laboratory effects are absent from the default library.
fixtures = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_System_Threading", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "loomward-fixtures"
path = "src/bin/loomward-fixtures.rs"
required-features = ["fixtures"]

[package]
name = "loomward-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Explicit opt-in: disposable laboratory effects are absent from the default library.
fixtures = []
# Internal content-read boundary: only loomward-engine enables this in the workspace.
content-read = []
# Capped shortcut bytes: only loomward-shell enables this in the workspace.
shortcut-read = []
# Owner-picked diagnostic bundle only (LW-055, ADR-V3-24).
diagnostics-export = []
# Unwired copy laboratory primitives; no service, transport or desktop enables this.
copy-primitives = ["content-read"]

[dependencies]
loomward-operations = { path = "../loomward-operations" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_System_Threading", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
loomward-operations = { path = "../loomward-operations", features = ["fault-injection"] }
proptest.workspace = true
# Interleaving tests probe the journal's write lock directly (#672).
rusqlite = { version = "0.38.0", features = ["bundled"] }
tempfile.workspace = true

# H7 measurement only: a child process keeps a writable mapped view of a staged file.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[[bin]]
name = "loomward-fixtures"
path = "src/bin/loomward-fixtures.rs"
required-features = ["fixtures"]

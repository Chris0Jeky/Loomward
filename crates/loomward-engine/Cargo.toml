[package]
name = "loomward-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Loomward v0.3 engine: jobs, scan, events, telemetry, placement, learning and the teacher runner behind the view service (docs/41 section 4). Scan, jobs, budgets and events are implemented; other lane entry points remain unavailable."

[features]
# Explicit fixture-only grant constructor; absent from production builds.
lab = []

[dependencies]
loomward-operations = { path = "../loomward-operations" }
loomward-catalog = { path = "../loomward-catalog" }
loomward-protocol = { path = "../loomward-protocol" }
loomward-core = { path = "../loomward-core" }
loomward-learn = { path = "../loomward-learn" }
loomward-telemetry = { path = "../loomward-telemetry" }
loomward-windows = { path = "../loomward-windows", features = ["content-read"] }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
getrandom = "0.4"
rusqlite = { version = "0.38.0", features = ["bundled"] }

[dev-dependencies]
loomward-catalog = { path = "../loomward-catalog" }
loomward-windows = { path = "../loomward-windows", features = ["fixtures"] }
jsonschema = { version = "0.58.6", default-features = false }
tempfile.workspace = true

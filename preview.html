<script>/* Local UI, no dependencies. Untrusted display values are always escaped. */
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GiB=1024**3;
const bytes = n => {if(n===null||n===undefined||!Number.isFinite(n))return 'Unknown';if(n===0)return '0 B';const u=['B','KiB','MiB','GiB','TiB'];const i=Math.min(4,Math.max(0,Math.floor(Math.log(n)/Math.log(1024))));return `${(n/1024**i).toLocaleString(undefined,{maximumFractionDigits:i>=3?1:0})} ${u[i]}`;};
const paths={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',storage:'M3 7h18v12H3z M3 7V4h7l2 3 M7 15h10',learn:'M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',tiers:'M3 6h18v4H3z M3 15h18v4H3z M7 8h.01 M7 17h.01',processes:'M3 12h4l3-8 4 16 3-8h4',activity:'M12 3a9 9 0 1 1-6.3 2.5 M3 3v6h6 M12 7v5l3 2',protection:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',arrow:'M5 12h14 M14 7l5 5-5 5',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',duplicate:'M8 8h12v13H8z M16 8V3H3v14h5',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4'};
const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.storage}"/></svg>`;
const navs=[['overview','Overview'],['storage','Storage explorer'],['learn','Organise & learn'],['tiers','Disk tiers'],['processes','Processes'],['activity','Activity'],['protection','Protection']];
let token=new URLSearchParams(location.hash.slice(1)).get('token');
// Keep the token in the fragment for this session: fragments are not sent in HTTP requests.
// Removing it made a refresh silently switch to demo mode. Closing the server revokes it.
let apiMode=Boolean(token), imported=false, page='overview', filter='', familyFilter='all', feedback=[], toastTimer;
let state;
const clone=x=>JSON.parse(JSON.stringify(x));
function demoState(){const d=clone(window.LOOMWARD_DEMO);return {mode:'demo',runtime:'standalone_preview',inventory:d.inventory,volumes:d.volumes,scenario:d.scenario,processes:d.processes,duplicates:null,last_plan:null,labels:['Documents','Finance','Media','Projects','Models','Archive'],predictions:d.demo_model?.predictions||{},learning:{training_count:d.seed_events.length,model_id:d.demo_model?.model_id||'synthetic-preview',synthetic_seed_count:d.seed_events.length},audit:{events:[],total:0},capabilities:{file_mutation:false,process_mutation:false,process_inspection:true},duplicate_examples:d.duplicate_examples};}
async function api(path,body){const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'X-Loomward-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});const value=await response.json();if(!response.ok)throw new Error(value.error||`Request failed (${response.status})`);return value;}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),5000);}
function download(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);}
const button=(text,action,kind='subtle',extra='')=>`<button class="button ${kind}" data-action="${action}" ${extra}>${esc(text)}</button>`;
function heading(eyebrow,title,sub,actions=''){return `<div class="page-heading"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p class="subheading">${esc(sub)}</p></div><div class="actions">${actions}</div></div>`;}
function metric(title,value,foot,ico){const [number,...unit]=value.split(' ');return `<div class="metric"><div class="metric-top">${esc(title)}<span class="metric-icon">${icon(ico)}</span></div><div class="metric-value">${esc(number)}<small>${esc(unit.join(' '))}</small></div><div class="metric-foot">${foot}</div></div>`;}
function family(file){const e=(file.extension||'').toLowerCase();if(['.mp4','.mov','.wav','.mp3','.mkv'].includes(e))return 'Video & audio';if(['.gguf','.safetensors','.onnx'].includes(e))return 'Models';if(['.zip','.7z','.tar','.gz'].includes(e))return 'Archives';if(['.pdf','.docx','.md','.txt','.xlsx'].includes(e))return 'Documents';return 'Other';}
const familyColors={'Video & audio':'#c2d5af','Models':'#b1ccc7','Archives':'#ead6b9','Documents':'#dce4ca','Other':'#d5dae5'};
function categories(){const map={};for(const f of state.inventory.files){const key=family(f);map[key]=(map[key]||0)+f.size_bytes;}return Object.entries(map).map(([name,size])=>({name,size})).filter(x=>x.size>0).sort((a,b)=>b.size-a.size);}
function mapLayout(items,x=0,y=0,w=100,h=100){if(!items.length)return [];if(items.length===1)return [{...items[0],x,y,w,h}];const total=items.reduce((a,b)=>a+b.size,0);let acc=0,index=0;while(index<items.length-1&&acc<total/2){acc+=items[index].size;index++;}const ratio=acc/total;return w>=h?[...mapLayout(items.slice(0,index),x,y,w*ratio,h),...mapLayout(items.slice(index),x+w*ratio,y,w*(1-ratio),h)]:[...mapLayout(items.slice(0,index),x,y,w,h*ratio),...mapLayout(items.slice(index),x,y+h*ratio,w,h*(1-ratio))];}
function treemap(){const cats=categories();return `<div class="treemap" role="group" aria-label="Logical file sizes grouped by extension family">${mapLayout(cats).map(r=>`<button class="tree-tile ${r.w*r.h<150?'tiny':''}" data-action="family" data-family="${esc(r.name)}" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;background:${familyColors[r.name]}" aria-label="${esc(r.name+' '+bytes(r.size))}" title="${esc(r.name+' · '+bytes(r.size))}">${r.w*r.h<150?'':`<strong>${esc(r.name)}</strong><span>${bytes(r.size)}</span>`}</button>`).join('')}</div><div class="legend">${cats.map(c=>`<span class="legend-item"><span class="legend-dot" style="background:${familyColors[c.name]}"></span>${esc(c.name)} ${bytes(c.size)}</span>`).join('')}</div>`;}
function drive(v){const used=100*(1-v.free_bytes/v.capacity_bytes);return `<div class="drive-row"><strong>${esc(v.name||v.id)}</strong><span class="muted">${v.tier===null?'Tier unknown':['Fast tier','Warm tier','Archive tier'][v.tier]||'Tier '+v.tier}</span></div><div class="drive-bar ${v.free_bytes/v.capacity_bytes<.12?'orange':''}"><span style="width:${used}%"></span></div><div class="drive-labels"><span>${bytes(v.capacity_bytes-v.free_bytes)} used of ${bytes(v.capacity_bytes)}</span><span>${bytes(v.free_bytes)} available</span></div>`;}
function suggestions(){return state.inventory.files.filter(f=>!f.flags?.includes('sensitive')).slice(0,3).map(f=>{const pred=state.predictions[f.id];const label=pred?.suggestions?.[0]?.label;return `<div class="suggestion"><div class="file-line"><div class="file-icon">${esc((f.extension||'FILE').replace('.','').toUpperCase().slice(0,4))}</div><div class="file-text"><div class="file-name">${esc(f.name)}</div><div class="file-meta">${bytes(f.size_bytes)} · ${esc(f.relative_path.split('/')[0])}</div></div></div><div class="suggestion-choice"><span>${label?`Suggested label <span class="arrow">→</span> ${esc(label)}`:'Choose a virtual collection'}</span>${button('Review','review','link small',`data-id="${esc(f.id)}"`)}</div></div>`;}).join('');}
function overview(){const inv=state.inventory,vol=state.volumes[0],p=state.processes;const available=p.available_memory_bytes;const used=p.total_memory_bytes?Math.round((1-available/p.total_memory_bytes)*100):null;return heading('A CLEARER PICTURE','Your workspace, in balance.','Understand the pressure. Review the choices. Keep control.',button('Inspect duplicates','duplicates','primary')+button('Export snapshot','export-snapshot'))+`<div class="metrics">${metric('Indexed logical size',bytes(inv.summary.logical_bytes),`${inv.summary.file_count.toLocaleString()} files in this snapshot`,'storage')}${metric('Primary disk available',vol?bytes(vol.free_bytes):'Unknown',vol?`${bytes(vol.capacity_bytes)} total capacity`:'No volume observation','tiers')}${metric('Learning examples',String(state.learning?.training_count||0),state.mode==='demo'?'Synthetic training examples':'From this local feedback profile','learn')}${metric('User-file changes','0','<em>Observation-only protection is on</em>','protection')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-header"><div><h2>Where your space goes</h2><p>Logical sizes, grouped by extension family</p></div>${button('Explore files','nav','link small','data-page="storage"')}</div>${vol?drive(vol):''}${treemap()}<div class="panel-footer"><span>Physical allocation and reclaimable space are separate measures.</span><span class="tag">${esc(inv.mode)}</span></div></section><section class="panel"><div class="panel-header"><div><h2>A little guidance from you</h2><p>Teach collections without moving files</p></div><span class="tag orange">Review first</span></div><div class="review-intro"><span class="big">✧</span><div><strong>Your corrections become examples.</strong><p>Model scores are uncalibrated. Nothing is acted on automatically.</p></div></div>${suggestions()}<div class="panel-footer"><span>Human feedback takes precedence.</span>${button('Open learning desk','nav','link small','data-page="learn"')}</div></section></div><div class="bottom-grid"><section class="panel"><div class="insight"><span class="insight-icon">${icon('tiers')}</span><div><strong>Room to breathe, without losing your place.</strong><p>${state.scenario?'Try a plan that moves cold, unpinned groups to a slower tier. Capacity reserves and movement budgets remain visible.':'Disk-tier planning needs explicit volume and file-group estimates. The scanner does not invent them.'}</p>${button('Explore disk balancing','nav','link small','data-page="tiers"')}</div></div></section><section class="panel"><div class="panel-header"><div><h2>Resource pulse</h2><p>${state.mode==='demo'?'Synthetic resource example':'Read-only process observations'}</p></div>${button('View processes','nav','link small','data-page="processes"')}</div><div class="memory-summary"><div class="progress-ring" style="background:conic-gradient(#79996b 0 ${used===null?0:used*3.6}deg,#eef1e8 ${used===null?0:used*3.6}deg)"><span>${used===null?'—':used+'%'}</span></div><div><strong>${available===undefined?'Not inspected':bytes(available)+' available'}</strong><p class="small-note">${p.total_memory_bytes?bytes(p.total_memory_bytes)+' system memory':'Enable optional process inspection in the local runtime.'}<br>No memory trimming or process termination.</p></div></div></section></div>`;}
function storage(){const inv=state.inventory;return heading('STORAGE EXPLORER','Know what is actually here.','Inspect logical sizes and coverage before drawing conclusions.',button('Rescan selected root','rescan','primary')+button('Export snapshot','export-snapshot'))+`<div class="hint-box"><strong>${esc(inv.root)}</strong><br>${inv.coverage.limit_hit?'The scan reached its entry limit. ':''}${inv.coverage.skipped_count} skipped entries · ${inv.coverage.error_count} errors · ${inv.summary.allocated_unknown_count} unknown allocation values. Logical totals are not disk usage or guaranteed reclaimable bytes.</div><div class="search-row"><label class="sr-only" for="file-search">Search filenames and paths</label><input class="search-box" id="file-search" placeholder="Search filenames or folders…" value="${esc(filter)}"><select id="family-filter" class="select" aria-label="Filter extension family"><option value="all">All file families</option>${categories().map(c=>`<option ${familyFilter===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select>${button('Inspect duplicates','duplicates')}</div><div id="file-table"></div>${duplicatePanel()}`;}
function renderFiles(){const target=$('#file-table');if(!target)return;const all=state.inventory.files.filter(f=>(familyFilter==='all'||family(f)===familyFilter)&&f.relative_path.toLowerCase().includes(filter.toLowerCase()));const rows=all.slice().sort((a,b)=>b.size_bytes-a.size_bytes).slice(0,200);target.innerHTML=`<div class="table-wrap"><table><thead><tr><th>FILE / FOLDER</th><th>FAMILY</th><th>LOGICAL SIZE</th><th>STATUS</th></tr></thead><tbody>${rows.map(f=>`<tr><td><div class="file-name">${esc(f.name)}</div><div class="small-note">${esc(f.relative_path)}</div></td><td>${esc(family(f))}</td><td class="numeric">${bytes(f.size_bytes)}</td><td><span class="tag">${esc(f.flags?.join(', ')||'Metadata only')}</span></td></tr>`).join('')||'<tr><td colspan="4">No matching files in this snapshot.</td></tr>'}</tbody></table></div><p class="small-note">Showing ${rows.length} of ${all.length} matching files. This bounded reference view is not the final million-file virtualised explorer.</p>`;}
function duplicatePanel(){if(!state.duplicates)return '';const d=state.duplicates;return `<div class="panel"><div class="panel-header"><div><h2>Duplicate inspection</h2><p>${bytes(d.bytes_read||0)} read · ${d.groups.length} groups observed</p></div><span class="tag orange">No deletion authority</span></div><p class="small-note">${esc(d.note||'Content equality does not establish which copy is safe to delete.')}${d.budget_exhausted?' The byte budget was exhausted; results are partial.':''}</p>${d.groups.map(g=>`<div class="hint-box"><strong>${bytes(g.logical_duplicate_bytes)} logical duplicate data</strong><br>${g.files.map(f=>esc(f.relative_path)).join('<br>')}</div>`).join('')||'<p class="small-note">No verified duplicate groups within this inspection budget.</p>'}</div>`;}
function learn(){const files=state.inventory.files.filter(f=>!f.flags?.includes('sensitive')).slice(0,100);return heading('PERSONAL LEARNING','Teach it your way.','A collection label is not a destination path, a move approval or a deletion decision.',button('Retrain from feedback','train','primary')+button('Export feedback','export-feedback'))+`<div class="hint-box"><strong>Human correction → local student → reviewable suggestion.</strong><br>${state.mode==='demo'?'The initial examples and file sizes in this workspace are synthetic. ':''}The teacher adapter is optional and CLI-only in this build. Low evidence triggers abstention; raw scores are never a safety probability.</div><div class="table-wrap"><table><thead><tr><th>ITEM</th><th>MODEL SUGGESTION</th><th>YOUR COLLECTION</th><th>FEEDBACK</th></tr></thead><tbody>${files.map(f=>{const p=state.predictions[f.id],top=p?.suggestions?.[0];return `<tr><td><div class="file-name">${esc(f.name)}</div><div class="small-note">${bytes(f.size_bytes)} · ${esc(f.relative_path)}</div></td><td>${top?`${esc(top.label)}<div class="small-note">${Math.round(top.score*100)}% relative score · ${p.abstain?'abstaining':'advice only'}</div>`:'Needs examples'}</td><td><select class="select label-choice" aria-label="Collection for ${esc(f.name)}" data-id="${esc(f.id)}">${state.labels.map(l=>`<option ${l===top?.label?'selected':''}>${esc(l)}</option>`).join('')}</select></td><td>${button('Save label','label','small',`data-id="${esc(f.id)}"`)}</td></tr>`;}).join('')}</tbody></table></div><p class="small-note">${apiMode&&!imported?'Feedback is stored in the local SQLite database.':'Standalone feedback stays in memory until exported. Retraining requires the Python runtime.'} No training on sensitive filenames in this view. Showing at most 100 review items.</p>`;}
function tiers(){if(!state.scenario)return heading('DISK TIERS','Placement needs a plan.','The prototype does not infer disk speed or file heat from filenames.')+`<section class="panel empty-state"><h2>No tier scenario is configured for this snapshot.</h2><p>Use the supplied scenario JSON and the planner CLI to provide volume capacity, independent allocation estimates, heat, pins and cooldown history.</p>${button('Export snapshot','export-snapshot')}<p class="small-note">Production volume discovery and learned hot/cold prediction are planned, not implemented.</p></section>`;const s=state.scenario;return heading('DISK TIERS','The right space for the right work.','Simulate cold-data placement. Keep active projects and pinned models close.',button('Export current plan','export-plan'))+`<div class="hint-box"><strong>Simulation only.</strong> Source bytes released, destination bytes required and transfer bytes are separate estimates. This baseline is constrained and deterministic; it is not a learned or globally optimal placement policy.</div><div class="split"><section class="panel"><div class="panel-header"><h2>Choose the balance</h2><span class="tag">No actual moves</span></div><label class="field" for="target-free">Target available space on primary disk (GiB)<input id="target-free" type="number" min="0" max="${s.volumes[0].capacity_bytes/GiB}" step="1" value="${s.target_free_bytes/GiB}"><small>Stop after reaching the target. Groups are indivisible.</small></label><label class="field" for="transfer-budget">Maximum transfer budget (GiB)<input id="transfer-budget" type="number" min="0" max="100000" step="1" value="${s.max_transfer_bytes/GiB}"></label><div class="small-note">DESTINATION AVAILABILITY</div>${s.volumes.filter(v=>v.id!==s.source_id).map(v=>`<label class="check-row"><input type="checkbox" data-volume="${esc(v.id)}" ${v.online?'checked':''}>${esc(v.name||v.id)} · ${bytes(v.free_bytes)} available</label>`).join('')}<div class="spacer"></div><div class="small-note">EXPLICIT PINS</div>${s.groups.map(g=>`<label class="check-row"><input type="checkbox" data-pin="${esc(g.id)}" ${g.pinned?'checked':''}>Keep ${esc(g.id)} on the primary disk</label>`).join('')}<div class="button-row">${button('Simulate this balance','simulate','primary')}</div></section><section class="panel"><div class="panel-header"><h2>What would change</h2><span class="tag green">Reviewable plan</span></div><div id="plan-results">${planView()}</div></section></div>`;}
function planView(){const p=state.last_plan;if(!p)return '<div class="empty-state"><h2>No plan has run yet.</h2><p>Change the budget or pins, then simulate.<br>Nothing will be moved.</p></div>';return `<div class="plan-result"><strong>${p.satisfied?'The target is reachable in this scenario.':bytes(p.shortfall_bytes)+' remains unmet.'}</strong><p>${p.proposals.length} whole groups proposed · ${bytes(p.transfer_bytes)} transfer budget used · 0 actual file changes</p></div>${p.proposals.map(g=>`<div class="flow"><div class="flow-node"><strong>${esc(g.group_id)}</strong><small>${bytes(g.source_bytes_relieved)} released on ${esc(g.source_id)}</small></div><span class="flow-arrow">→</span><div class="flow-node"><strong>${esc(g.target_id)}</strong><small>${bytes(g.destination_bytes_required)} required</small></div></div>`).join('')}<div class="small-note">Projected available space:</div>${Object.entries(p.projected_free_bytes).map(([id,n])=>`<div class="drive-row" style="margin:12px 0"><span>${esc(id)}</span><strong>${bytes(n)}</strong></div>`).join('')}<p class="small-note">${p.rejected.length} groups were ineligible or could not fit. Human consent and native safety verification are still required before a future executor could act.</p>`;}
function simulateLocal(s){const free=Object.fromEntries(s.volumes.map(v=>[v.id,v.free_bytes])),source=s.volumes.find(v=>v.id===s.source_id);let transfer=0;const proposals=[],rejected=[];for(const g of [...s.groups].sort((a,b)=>a.heat-b.heat||b.source_bytes-a.source_bytes||a.id.localeCompare(b.id))){if(g.pinned||g.active||g.protected||g.heat===null||g.heat>.25||g.days_since_move<s.cooldown_days){rejected.push({group_id:g.id,reason:'ineligible'});continue;}if(free[s.source_id]>=s.target_free_bytes)continue;if(transfer+g.transfer_bytes>s.max_transfer_bytes){rejected.push({group_id:g.id,reason:'budget'});continue;}const targets=s.volumes.filter(v=>v.id!==s.source_id&&v.online&&v.writable&&v.tier>=source.tier&&free[v.id]-g.destination_bytes>=v.reserve_bytes).sort((a,b)=>b.tier-a.tier||free[b.id]-free[a.id]);if(!targets.length){rejected.push({group_id:g.id,reason:'capacity_or_offline'});continue;}const v=targets[0];free[s.source_id]+=g.source_bytes;free[v.id]-=g.destination_bytes;transfer+=g.transfer_bytes;proposals.push({group_id:g.id,source_id:s.source_id,target_id:v.id,source_bytes_relieved:g.source_bytes,destination_bytes_required:g.destination_bytes,transfer_bytes:g.transfer_bytes,executable:false,requires_consent:true});}return {mode:'simulation',algorithm:'standalone_demo_greedy',optimality_claim:false,proposals,rejected,projected_free_bytes:free,target_free_bytes:s.target_free_bytes,shortfall_bytes:Math.max(0,s.target_free_bytes-free[s.source_id]),satisfied:free[s.source_id]>=s.target_free_bytes,transfer_bytes:transfer,filesystem_changed:false};}
function processes(){const p=state.processes;return heading('RESOURCE PULSE','Understand the workload.','Read processes, not just percentages. No process-control actions are enabled.',button('Refresh observations','process-refresh','primary',state.capabilities?.process_inspection?'':'disabled'))+`<div class="hint-box"><strong>${state.mode==='demo'?'Synthetic process example.':esc(p.status)}</strong><br>${esc(p.note||'No telemetry sample yet.')} Lowering the displayed working set is not the same as fixing memory pressure.</div>${p.total_memory_bytes?`<div class="metrics">${metric('System memory',bytes(p.total_memory_bytes),'OS memory observation','processes')}${metric('Available memory',bytes(p.available_memory_bytes),'Not a sum of process working sets','processes')}${metric('Displayed processes',String(p.processes.length),p.display_truncated?'A bounded subset of observations':'Read-only observations','activity')}${metric('Process changes','0','No kill, suspend or trim operations','protection')}</div>`:''}<div class="table-wrap"><table><thead><tr><th>PROCESS</th><th>PID / START IDENTITY</th><th>RESIDENT MEMORY</th><th>CPU / MACHINE</th><th>CONTROL</th></tr></thead><tbody>${p.processes.map(r=>`<tr><td><strong>${esc(r.name)}</strong></td><td>${r.pid}<div class="small-note">${esc(r.start_time)}</div></td><td>${bytes(r.resident_bytes)}<div class="process-bar"><span style="width:${Math.min(100,r.resident_bytes/(p.total_memory_bytes||1)*100)}%"></span></div></td><td>${r.cpu_percent_of_machine===null?'Needs second sample':r.cpu_percent_of_machine+'%'}</td><td><span class="tag">Observation only</span></td></tr>`).join('')||'<tr><td colspan="5">No process observations. Run with the optional telemetry extra and --processes to enable them.</td></tr>'}</tbody></table></div>`;}
function activity(){const events=apiMode&&!imported?(state.audit?.events||[]).map(x=>x.payload.event):[...feedback].reverse();return heading('ACTIVITY','A record you can inspect.','Feedback is not a file operation. No files have been moved, renamed or deleted.',button('Export feedback','export-feedback'))+`<section class="panel"><div class="panel-header"><div><h2>${apiMode&&!imported?'Local feedback audit':'Browser-session feedback'}</h2><p>${apiMode&&!imported?'SQLite persistence with an unkeyed hash chain. Not a signed security log.':'Export these events before closing this standalone preview.'}</p></div><span class="tag">${events.length} displayed events</span></div>${events.map(e=>`<div class="activity-item"><span class="activity-dot"></span><div><strong>${esc(e.features?.name||e.item_id)} → ${esc(e.label)}</strong><p>Human feedback · revision ${e.revision}<br>${esc(e.recorded_at||'This browser session')} · Filesystem unchanged</p></div></div>`).join('')||'<div class="empty-state"><h2>No feedback saved in this session.</h2><p>Review a file in the learning desk to create an example.</p></div>'}</section>`;}
function protection(){return heading('PROTECTION','Recovery is a feature, not a promise.','Backup providers, verified restores and the Windows action broker are planned, not connected.')+`<div class="hint-box"><strong>This prototype does not create backups.</strong> Moving a file to another disk is not a backup. A healthy badge will require provider evidence and a successful restore test, not just a completed copy.</div><div class="protection-cards">${[['protection','Verified recovery','Track snapshots, manifests, retention and restore drills. Provider failures and incomplete metadata support must remain visible.'],['activity','Transactional actions','A future executor must recheck file identity, reserve space, verify copied content and metadata, and preserve recovery evidence across crashes.'],['tiers','Independent copies','Keep working placement separate from protection. A target disk can be unavailable, full or in the same failure domain as the source.']].map(([i,h,p])=>`<section class="panel"><span class="metric-icon">${icon(i)}</span><h2>${h}</h2><p>${p}</p><span class="tag orange">Architecture / backlog</span></section>`).join('')}</div><div class="spacer"></div><section class="panel"><div class="panel-header"><h2>Current safety boundary</h2><span class="tag green">Enforced by omission</span></div><p class="small-note">The API has no move, delete, rename, uninstall, process kill or priority-change endpoint. The local model has no tools. The UI cannot authorise a capability that does not exist.</p><div class="code-note">Observe → suggest → review → simulate. Execution is deliberately absent.</div></section>`;}
const pages={overview,storage,learn,tiers,processes,activity,protection};
function render(){const title=navs.find(n=>n[0]===page)[1];$('#crumb').textContent=title;$('#navigation').innerHTML=navs.map(([id,label])=>`<button class="nav-item ${page===id?'active':''}" data-action="nav" data-page="${id}" aria-label="${label}" ${page===id?'aria-current="page"':''}>${icon(id)}<span class="nav-text">${label}</span></button>`).join('');$('#workspace-kind').textContent=state.mode==='demo'?'Demo workspace':imported?'Imported snapshot':'Observed workspace';$('#mode-banner').innerHTML=`<span><strong>${state.mode==='demo'?'INTERACTIVE DEMO':imported?'IMPORTED SNAPSHOT':'OBSERVED METADATA'}</strong> · ${state.mode==='demo'?'Synthetic data, not your computer.':imported?'No live file access from this import.':'Only the root selected at startup is in scope.'}</span><span class="tag">No filesystem or process mutations</span>`;$('#content').innerHTML=pages[page]();$('#footer-status').textContent=apiMode&&!imported?'Python reference runtime · local session':'Standalone preview · export feedback to keep it';renderFiles();}
async function refresh(){if(apiMode&&!imported)state=await api('/api/state');render();}
function fileFeatures(f){return {name:f.name.slice(0,256),extension:(f.extension||'').slice(0,32),context:f.relative_path.split('/').slice(-3,-1).join(' ').slice(0,512),size_bytes:f.size_bytes};}
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;try{if(action==='nav'){page=el.dataset.page;render();return;}if(action==='import'){$('#snapshot-file').click();return;}if(action==='export-snapshot'){download('loomward-snapshot.json',state.inventory);return;}if(action==='export-plan'){if(!state.last_plan){toast('Simulate a plan first.');return;}download('loomward-plan.json',state.last_plan);return;}if(action==='export-feedback'){const rows=apiMode&&!imported?(await api('/api/feedback')).events:feedback;download('loomward-feedback.json',{schema_version:1,events:rows,mode:state.mode});return;}if(action==='family'){familyFilter=el.dataset.family;page='storage';render();return;}if(action==='review'){page='learn';render();document.querySelector(`.label-choice[data-id="${CSS.escape(el.dataset.id)}"]`)?.focus();return;}if(action==='label'){const id=el.dataset.id;const label=document.querySelector(`.label-choice[data-id="${CSS.escape(id)}"]`).value;const f=state.inventory.files.find(x=>x.id===id);if(apiMode&&!imported){await api('/api/label',{item_id:id,label,event_id:crypto.randomUUID()});await refresh();toast('Label saved locally. Student retrained. No file was moved.');}else{feedback.push({event_id:crypto.randomUUID(),item_id:id,source:'human',revision:1+feedback.filter(x=>x.item_id===id).length,label,features:fileFeatures(f),retracted:false,recorded_at:new Date().toISOString()});toast('Label saved in this browser session. Export feedback to train locally.');}return;}if(action==='train'){if(apiMode&&!imported){await api('/api/train',{});await refresh();toast('Student retrained from local feedback. No actions authorised.');}else toast('Retraining runs in the Python reference. Export feedback to continue there.');return;}if(action==='duplicates'){if(imported){toast('Imported snapshots do not grant access to file contents. Use the local runtime.');return;}if(apiMode){if(state.mode!=='demo'&&!confirm('Read file contents in the selected root to check duplicates? This run has a 256 MiB read budget. No files will be deleted.'))return;toast('Inspecting within the read budget…');state.duplicates=await api('/api/duplicates',{confirm_content_read:true,byte_budget:256*1024**2});}else state.duplicates={groups:state.duplicate_examples,bytes_read:0,mode:'demo',note:'Synthetic duplicate example. No file contents were read.',reclaimable_bytes:null};page='storage';render();toast('Inspection ready. Duplicate data is not automatically safe to delete.');return;}if(action==='rescan'){if(apiMode&&!imported){await api('/api/rescan',{});await refresh();toast('Selected root rescanned. No files modified.');}else toast('A real scan requires the local runtime and an explicit root.');return;}if(action==='simulate'){const s=clone(state.scenario);const goal=Number($('#target-free').value),budget=Number($('#transfer-budget').value);if(!Number.isSafeInteger(goal)||!Number.isSafeInteger(budget)||goal<0||goal>s.volumes.find(v=>v.id===s.source_id).capacity_bytes/GiB||budget<0||budget>100000)throw new Error('Use nonnegative whole GiB values within the volume capacity and transfer limit.');s.target_free_bytes=goal*GiB;s.max_transfer_bytes=budget*GiB;document.querySelectorAll('[data-volume]').forEach(i=>s.volumes.find(v=>v.id===i.dataset.volume).online=i.checked);document.querySelectorAll('[data-pin]').forEach(i=>s.groups.find(g=>g.id===i.dataset.pin).pinned=i.checked);state.scenario=s;state.last_plan=apiMode&&!imported?await api('/api/plan',s):simulateLocal(s);$('#plan-results').innerHTML=planView();toast('Simulation complete. No files moved.');return;}if(action==='process-refresh'){if(apiMode&&!imported){state.processes=await api('/api/processes',{});render();toast('Read-only observations refreshed.');}else toast('These are synthetic processes. Use the local runtime for telemetry.');return;}}catch(error){toast(error.message);}});
document.addEventListener('input',e=>{if(e.target.id==='file-search'){filter=e.target.value;renderFiles();}});
document.addEventListener('change',e=>{if(e.target.id==='family-filter'){familyFilter=e.target.value;renderFiles();}});
$('#snapshot-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024**2)throw new Error('Snapshot exceeds the 20 MiB import limit.');const inv=JSON.parse(await file.text());if(inv.schema_version!==1||!Array.isArray(inv.files)||inv.files.length>200000||!inv.summary||!inv.coverage)throw new Error('Unsupported snapshot schema.');const ids=new Set();let total=0;for(const f of inv.files){if(typeof f.id!=='string'||!f.id||f.id.length>128||ids.has(f.id)||typeof f.name!=='string'||typeof f.relative_path!=='string'||f.name.length>4096||f.relative_path.length>32768||!Number.isSafeInteger(f.size_bytes)||f.size_bytes<0||f.flags&&!Array.isArray(f.flags))throw new Error('Invalid or duplicate file record.');ids.add(f.id);total+=f.size_bytes;}if(!Number.isSafeInteger(total)||inv.summary.logical_bytes!==total||inv.summary.file_count!==inv.files.length)throw new Error('Snapshot totals do not match its records.');const count=n=>Number.isSafeInteger(n)&&n>=0&&n<=2000000000;if(typeof inv.root!=='string'||inv.root.length>32768||typeof inv.mode!=='string'||!['observed','demo','imported'].includes(inv.mode)||!count(inv.summary.allocated_unknown_count)||!count(inv.coverage.skipped_count)||!count(inv.coverage.error_count)||typeof inv.coverage.limit_hit!=='boolean')throw new Error('Invalid snapshot coverage or metadata.');for(const f of inv.files){if(typeof f.extension!=='string'||f.extension.length>256||f.flags&&f.flags.some(x=>typeof x!=='string'||x.length>128))throw new Error('Invalid extension or flags.');}inv.mode='imported';state=demoState();state.mode='imported';state.inventory=inv;state.volumes=[];state.scenario=null;state.processes={status:'not_requested',processes:[],note:'Imported data does not grant process access.'};state.predictions={};state.learning={training_count:0};state.capabilities.process_inspection=false;state.duplicates=null;state.audit={events:[],total:0};feedback=[];imported=true;page='storage';filter='';familyFilter='all';render();toast('Snapshot imported locally. No live file access was granted.');}catch(error){toast(error.message);}finally{e.target.value='';}});
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();document.querySelector('#main').focus();document.querySelector('#main').scrollIntoView();});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();page='storage';render();$('#file-search').focus();}});
(async()=>{try{state=apiMode?await api('/api/state'):demoState();render();}catch(error){$('#mode-banner').textContent='CONNECTION FAILED · no data loaded';$('#content').innerHTML=`<div class="error-box"><strong>Cannot reach the local session.</strong><p>${esc(error.message)}</p><p>Reopen the session URL printed by the local runtime. No demo data is substituted for a failed live connection.</p></div>`;}})();
})();
</script>
</body></html>

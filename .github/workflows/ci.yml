name: reference-and-native
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: python
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --check ui/app.js
      - run: node --check ui/expansion.js
      - run: node tests/test_ui_logic.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable test --workspace
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('Cargo.lock', 'native/Cargo.lock') }}
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm --prefix app run build
      - run: cargo +stable fmt --manifest-path native/Cargo.toml --check
      - run: cargo +stable build --manifest-path native/Cargo.toml
      - run: cargo +stable test --manifest-path native/Cargo.toml
      - run: cargo +stable clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: ./native/target/debug/loomward-desktop.exe --self-test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright
      # Hosted Windows supports real Tauri windows; CDP drives WebView2 without human input.
      # This is windowed automation (including WM_CLOSE), not Chromium's headless mode.
      # https://v2.tauri.app/develop/tests/webdriver/ci/
      - name: WebView2 runtime present
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Select-Object -First 1 pv | Format-List
      - run: python native/tests/webview2_probe.py --out .loomward/ci-webview2
      - name: Desktop shell log on failure
        if: failure()
        run: Get-ChildItem .loomward/ci-webview2 -Filter *.log | ForEach-Object { "== $($_.Name)"; Get-Content -Raw $_.FullName }
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm --prefix app run check
      - run: npm --prefix app run test
      - run: npm --prefix app run build
      - if: runner.os == 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python scripts/test_app.py
      - if: runner.os == 'Linux'
        run: python scripts/test_ui.py
        env:
          PYTHONPATH: python
# Hosted CI first ran green on 2026-10-09 (PR #2). Actions are pinned to full commit SHAs.

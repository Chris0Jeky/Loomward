name: release-preview
# Unsigned Windows preview pre-release of the Tauri desktop shell (owner decision HUMAN_TODO q-17).
# Run it by hand (workflow_dispatch from main) or push a tag v<major>.<minor>.<patch>-preview.<n>.
# See RELEASING.md. The build, self-test and install smoke test live in .github/actions/desktop-installer
# (shared with nightly.yml). Nothing here code-signs or publishes a package. The only secrets besides
# GITHUB_TOKEN are the optional updater-signing pair; without them no latest.json is published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Preview version without the leading v, e.g. 0.3.0-preview.1'
        required: true
        type: string
  push:
    tags:
      - 'v*-preview.*'
permissions:
  contents: read
concurrency:
  group: release-preview
  cancel-in-progress: false
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the tag (dispatch) and the release; the only write scope in this file
    defaults:
      run:
        shell: bash
    env:
      INPUT_VERSION: ${{ inputs.version }}
      # Updater signatures (HUMAN_TODO q-30). Empty when the owner has not stored the key yet.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the reachability check below needs main's history and the tags
          persist-credentials: false # build scripts and npm never see the token; gh gets it by env below
      - name: Resolve and check the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then raw="$INPUT_VERSION"; else raw="$GITHUB_REF_NAME"; fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.3.0-preview.1 (got '$version')"; exit 1
          fi
          # Releases come only from main's history, so a dispatch from a side branch is refused.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from origin/main"; exit 1
          fi
          # A dispatch creates the tag, so it must not exist yet; a tag push brought its own.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists; roll it back first (RELEASING.md)"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; delete it first (RELEASING.md)"; exit 1
          fi
      - name: Build, self-test, install and uninstall
        id: build
        uses: ./.github/actions/desktop-installer
        with:
          version: ${{ env.VERSION }}
      - name: Write the updater manifest (signed builds only)
        if: steps.build.outputs.signed == 'true'
        run: |
          python scripts/release_meta.py latest-json --version "$VERSION" --tag "$TAG" \
            --installer "$(ls release-assets/*-setup.exe)" \
            --notes "Loomward $VERSION, an unsigned preview. Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            > release-assets/latest.json
          cat release-assets/latest.json
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_meta.py notes --version "$VERSION" --ref "$TAG" --sha "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Loomward $VERSION (unsigned preview)" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Point the preview update channel at this release (signed builds only)
        if: steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The updater cannot follow /releases/latest (that skips pre-releases), so the preview channel
          # reads latest.json from this rolling pre-release (native/src/updates.rs).
          if ! gh release view preview-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create preview-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Preview update channel (updater metadata only)" \
              --notes "Holds only latest.json, which points the opt-in updater at the newest preview. Download installers from the versioned preview releases."
          fi
          gh release upload preview-latest release-assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber
